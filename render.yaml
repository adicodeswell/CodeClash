services:
  # 1. Express API Backend (Web Service)
  - type: web
    name: codeclash-api
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma --config prisma7.config.ts generate
    startCommand: npm --prefix apps/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codeclash-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://codeclash-web.onrender.com
      - key: COOKIE_SAME_SITE
        value: none
      - key: JUDGE0_BASE_URL
        value: https://ce.judge0.com
      - key: WORKER_ID
        value: judge-worker-render-api

  # 2. Judge Worker Execution Daemon (Background Worker)
  - type: worker
    name: codeclash-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma --config prisma7.config.ts generate
    startCommand: npm --prefix apps/judge-worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: codeclash-db
          property: connectionString
      - key: WORKER_ID
        value: judge-worker-primary
      - key: JUDGE0_BASE_URL
        value: https://ce.judge0.com

  # 3. React Vite SPA (Static Site)
  - type: web
    name: codeclash-web
    runtime: static
    buildCommand: npm install && npm --prefix apps/web run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://codeclash-api.onrender.com

databases:
  # 4. Managed PostgreSQL Database
  - name: codeclash-db
    databaseName: codeclash
    user: codeclash
    plan: free
